<style>

    background-size: cover;

    margin: 0;
    display: flex;

    align-items: center;

#droydButton {
    width: 400px;
    height: 400px;
   background-color: transparent;
   border-color: transparent;
   border: 10px solid transparent;
   border-radius: 50%;
   overflow: hidden;
   box-sizing: border-box;
   padding: 0;
}

@keyframes clickAnimation {
    0% { transform: scale(1); }
    50% { transform: scale(0.9); }
    100% { transform: scale(1); }
}

#droydButton.clicked {
    animation: clickAnimation 0.2s ease-in-out;
}

#droydButton img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

<script src="DroydCoinClicker_Scripts.js"></script>
<script>
const droydButton = document.getElementById("droydButton");
const clickSound = document.getElementById("clickSound");

droydButton.addEventListener("click", () => {
    clickSound.currentTime = 0;
    clickSound.play();

    droydButton.classList.remove("clicked");
    void droydButton.offsetWidth;
    droydButton.classList.add("clicked");
});
</script>
